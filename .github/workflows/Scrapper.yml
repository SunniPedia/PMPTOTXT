name: Scrape Pamphlets

on:
  schedule:
    - cron: '0 0 * * *' # প্রতিদিন স্বয়ংক্রিয়ভাবে চলার জন্য
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি রান করার জন্য

permissions:
  contents: write # গিটহাবে ফাইল push করার অনুমতি নিশ্চিত করতে

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scraper.py
